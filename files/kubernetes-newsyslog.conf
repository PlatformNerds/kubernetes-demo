# Rotate the kubelet log (newsyslog.conf(5)). The kubelet rc script runs it
# under daemon(8) -o ... -H, which reopens the log file on SIGHUP.
# logfilename          [owner:group] mode count size(KB) when flags [/pid_file]
/var/log/kubelet.log                 600  7     102400   *    JC    /var/run/kubelet_daemon.pid
