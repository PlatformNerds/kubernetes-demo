# Rotate the kubelet and CRI-O logs (newsyslog.conf(5)). The kubelet rc
# script runs it under daemon(8) -o ... -H, which reopens the log file on
# SIGHUP; CRI-O reopens its --log file on SIGHUP (and reloads its config).
# logfilename          [owner:group] mode count size(KB) when flags [/pid_file]
/var/log/kubelet.log                 600  7     102400   *    JC    /var/run/kubelet_daemon.pid
/var/log/crio.log                    644  7     102400   *    JC    /var/run/crio.pid
